<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ثمرة | اطلب خضارك وفاكهتك</title>
<meta name="description" content="ثمرة: خضار وفاكهة طازجة وخضار جاهز للطبخ، توصيل سريع أو بموعد في العبور، الحي التاسع">
<meta name="theme-color" content="#fbf6ee">
<meta name="color-scheme" content="light">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:title" content="ثمرة | اطلب خضارك وفاكهتك">
<meta property="og:image" content="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fbf6ee;--card:#fffdf9;--ink:#33281f;--mute:#8a7a6c;--line:#eaded0;--green:#a52a3a;--gold:#6f8f3b;--onG:#fffaf3;--shadow:0 6px 24px rgba(120,60,50,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-image:radial-gradient(circle at 50% -10%,#fff 0,transparent 55%);background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 150px}
header{text-align:center;padding:44px 0 22px}
.brand{font-family:'Amiri',Georgia,serif;font-size:54px;font-weight:700;color:var(--green);line-height:1}
.orn{width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,#a52a3a,#6f8f3b);margin:14px auto}.logo{width:170px;max-width:60%;display:block;margin:0 auto}
.tag{color:var(--mute);font-weight:300;letter-spacing:.3px}
.badge{display:inline-block;margin-top:14px;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:5px 16px;font-size:14px}
.upd{color:var(--mute);font-size:13px;margin-top:10px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;justify-content:center;padding:10px 0;border-bottom:1px solid var(--line)}
nav button{font:inherit;background:none;border:0;color:var(--mute);padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;font-size:16px}
nav button.on{color:var(--green);border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:20px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:.2s}
.card.off{opacity:.45}
.row{display:flex;align-items:center;gap:14px;padding:12px;cursor:pointer}
.img{width:76px;height:76px;border-radius:14px;background:linear-gradient(135deg,var(--line),var(--bg));display:grid;place-items:center;font-size:32px;flex:none;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.nm{font-family:'Amiri',serif;font-size:21px;font-weight:700;color:var(--ink)}
.pr{color:var(--green);font-weight:500;margin-top:2px}.pr small{color:var(--mute);font-weight:300}
.inc{margin-inline-start:auto;background:var(--green);color:var(--onG);border-radius:99px;padding:3px 10px;font-size:12px}
.pick{display:none;gap:10px;padding:0 12px 14px;align-items:center}
.card.open .pick{display:flex}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.btn{font:inherit;background:var(--green);color:var(--onG);border:0;border-radius:12px;padding:11px 18px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn.ghost{background:none;color:var(--green);border:1px solid var(--green)}
.bar{position:fixed;inset:auto 0 0 0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);z-index:8;display:none}
.bar.show{display:block}
.bar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;margin:0 auto;font:inherit;font-size:17px;background:var(--green);color:var(--onG);border:0;border-radius:16px;padding:16px 22px;cursor:pointer;box-shadow:var(--shadow)}
.sheet{position:fixed;inset:0;background:rgba(10,15,12,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.panel h2{font-family:'Amiri',serif;color:var(--green);margin:0 0 12px;font-size:28px}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li .n{flex:1}.li select{width:auto;padding:8px}
.x{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:16px 0;color:var(--green)}
.f{display:grid;gap:10px;margin-top:6px}
.adm{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:12px;margin:16px 0;display:none;gap:10px;flex-wrap:wrap;align-items:center}
.adm.show{display:flex}
.ae{display:none;gap:8px;padding:0 12px 12px;align-items:center;flex-wrap:wrap}
.admin .ae{display:flex}.admin .pick{display:none!important}
.ae input[type=number]{width:90px}
.ae label{font-size:13px;color:var(--mute);display:flex;gap:4px;align-items:center}
.ae label input{width:auto}
.ft{text-align:center;color:var(--mute);font-size:13px;margin-top:40px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.card{position:relative}
.row{flex-direction:column;text-align:center;padding:10px 8px 12px;gap:8px}
.img{width:100%;height:auto;aspect-ratio:1/1;font-size:40px}
.nm{font-family:'Tajawal',Tahoma,sans-serif;font-size:14px;font-weight:500;line-height:1.35}
.pr{font-size:13px;margin-top:0}
.inc{position:absolute;top:14px;inset-inline-start:14px;margin:0;font-size:11px;padding:2px 8px}
.card.open{grid-column:1/-1}
.card.open .row,.admin .row{flex-direction:row;text-align:start;padding:12px;gap:14px}
.card.open .img,.admin .img{width:76px;aspect-ratio:auto;height:76px;font-size:32px}
.card.open .nm,.admin .nm{font-size:18px}
.card.open .inc{position:static;margin-inline-start:auto}
.img svg{display:block;padding:8px}
.sb{position:relative;margin:4px 0 12px}
.sb input{padding:13px 46px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:16px}
.sb input::-webkit-search-cancel-button{display:none}
.sb .si{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);pointer-events:none}
.sb .sx{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:6px}
.addf{display:grid;gap:8px;flex:1 1 100%}.addf label{display:flex;gap:6px;align-items:center;color:var(--mute)}.addf label input{width:auto}
.btn.del{color:#a52a3a;border-color:#a52a3a}.warn.ok{background:#e9f0dc;color:#4f6a25}
.ct{margin-top:34px;text-align:center}.ctt{color:var(--mute);font-size:13px;margin-bottom:10px;letter-spacing:.5px}
.cl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ci{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px 8px 14px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);font-size:15px}
.ci svg{width:26px;height:26px;flex:none}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}}
.card .row{padding:10px 8px 12px;gap:8px}
.nm{font-size:14px;line-height:1.35}
.pr{font-size:13px;line-height:1.35}.pr small{display:block;font-size:11px}
.inc{top:14px;inset-inline-start:14px;font-size:11px;padding:2px 8px}
.pv{width:64px;height:64px;object-fit:cover;border-radius:12px;display:block;margin:0 auto}
.addf label.tl{display:grid;gap:4px;font-size:13px}.ae label.nmi{flex:1 1 100%;display:grid;gap:4px}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pmb{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pmb.on{background:var(--green);color:var(--onG);border-color:var(--green)}
.hint{color:var(--mute);font-size:13px;text-align:center}
.cs{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;background:var(--card)}
.cst{font-family:'Amiri',serif;font-size:20px;color:var(--green);font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cs .li{padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--bg)}
.cs .li:last-child{margin-bottom:0}
.cs .li small{color:var(--mute)}.cs .ln{font-weight:500}
.cs .tot{padding:4px 0 8px}.dlr{color:var(--mute);font-size:14px;margin-bottom:8px}
.cs .sec{background:var(--bg)}
.btn[data-off]{opacity:.45}
.pnote{background:#fbf1d8;color:#7a5a12;border-radius:12px;padding:10px 12px;text-align:center;font-size:14px}
.sec a.btn{display:block;text-align:center;text-decoration:none}
.sec{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:grid;gap:8px}
.sec .sh{font-weight:700;color:var(--green)}.or{text-align:center;color:var(--mute);font-size:14px}
.sr{text-align:center;color:var(--green);font-size:14px;margin-top:12px}.sr:empty{display:none}
nav.srch button.on{color:var(--mute);border-color:transparent;font-weight:400}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:36px 10px;line-height:1.8}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.mode{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;align-items:center}
.mode b{font-size:17px}.mode small{color:var(--mute);font-weight:300}
.mode.on{background:var(--green);color:var(--onG);border-color:var(--green)}.mode.on small{color:var(--onG);opacity:.85}
.sched{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:12px;text-align:center}
.sched .e{color:var(--mute);font-size:14px}.sched .t{font-size:21px;color:var(--green);font-weight:700;margin:4px 0 10px}
.sched small{display:block;color:var(--mute);margin-top:8px;font-size:12px}
.ov{position:fixed;inset:0;background:rgba(40,25,20,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.dlg{position:relative;background:var(--bg);width:100%;max-width:420px;border-radius:24px 24px 0 0;padding:28px 20px calc(22px + env(safe-area-inset-bottom,0px));text-align:center}
@media(min-width:700px){.dlg{border-radius:24px}}
.dlg .cl{position:absolute;top:10px;inset-inline-start:14px}
.img.big{width:130px;height:130px;margin:0 auto 10px;border-radius:20px;aspect-ratio:auto}
.nm.big{font-size:22px}
.wsel{position:relative;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px 16px;margin:16px 0 4px;cursor:pointer}
.wsel span{color:var(--mute)}.wsel b{color:var(--green)}.wsel b:after{content:' ▾'}
.wsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.mt{display:flex;justify-content:space-between;padding:14px 4px;font-size:18px;color:var(--green)}
.btn.wide{width:100%;margin-top:8px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.warn{background:#f6e4e6;color:#a52a3a;border-radius:12px;padding:10px 12px;text-align:center;font-size:14px;margin-bottom:8px}
.bar .cb{display:block;position:relative;overflow:hidden;background:#6b5a4d;padding:0;height:66px;text-align:start}
.bar .cb .fill{position:absolute;top:0;bottom:0;left:0;right:auto;background:var(--green);transition:width .35s}
.bar .cb.full .fill{background:#6f8f3b}
.bar .cb .cr{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:12px 22px 0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.bar .cb .ch{position:relative;z-index:1;display:block;font-size:12px;padding:2px 22px 0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}

.grid.admin{grid-template-columns:1fr}
@media(min-width:700px){.grid.admin{grid-template-columns:1fr 1fr}}

.img{position:relative}
.img .fb{display:grid;place-items:center;width:100%;height:100%}
.img img~.fb{display:none}
.sk .img{background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
.skl{height:12px;border-radius:6px;background:var(--line);width:70%;margin:4px auto 0}.skl.s{width:45%}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.oid{font-size:16px;margin:2px 0 10px;color:var(--mute)}.oid b{color:var(--green);font-size:20px}
.newc{background:#e9f0dc;color:#3f5f1f;border-radius:14px;padding:12px;margin:8px 0 10px;line-height:1.8}.newc b{font-size:22px}.newc small{color:#5b6f3a}
#cmsg a{color:inherit;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
